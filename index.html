<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Red Lines Retro</title>
    <link rel="icon" href="logo.png">
    <style>
        body { background-color: #0d0d0d; color: #fff; text-align: center; margin: 0; font-family: sans-serif; }
        h1 { color: #888; letter-spacing: 5px; border-bottom: 3px solid #d32f2f; display: inline-block; padding-bottom: 10px; margin-top: 20px; text-transform: uppercase; }
        .cabinet-frame { width: 80%; max-width: 800px; height: 450px; margin: 40px auto; border: 15px solid #222; background: #000; position: relative; box-shadow: 0 10px 30px rgba(0,0,0,0.8); }
        #game-container { width: 100%; height: 100%; }
        #banner { width: 100%; height: 100%; object-fit: cover; cursor: pointer; position: absolute; top: 0; left: 0; z-index: 10; }
        @media (max-width: 768px) {
            h1 { font-size: 20px; letter-spacing: 2px; }
            .cabinet-frame { width: 95%; height: 250px; margin: 20px auto; border-width: 5px; }
        }
    </style>
</head>
<body>
    <h1>Red Lines Retro</h1>
    <div class="cabinet-frame">
        <img id="banner" src="banner.png" alt="Click to Start">
        <div id="game-container"></div>
    </div>

    <script>
        document.getElementById('banner').addEventListener('click', function() {
            this.style.display = 'none';
            
            window.EJS_player = '#game-container';
            window.EJS_core = 'psp';
            window.EJS_gameName = 'Burnout';
            window.EJS_color = '#d32f2f';
            window.EJS_startOnLoaded = true;
            
            // Fixed: Pointing exclusively to the compiled 'stable' release
            window.EJS_pathtodata = 'https://cdn.emulatorjs.org/stable/data/';
            window.EJS_gameUrl = 'PASTE_YOUR_ARCHIVE_ORG_LINK_HERE';

            var script = document.createElement('script');
            script.src = 'https://cdn.emulatorjs.org/stable/data/emulator.min.js';
            document.body.appendChild(script);
        });
    </script>
</body>
</html>
